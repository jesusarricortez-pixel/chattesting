<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lowe's Pro Chat Simulator</title>
<style>
:root{--lowes-blue:#004990;--bg-color:#f4f5f7;--panel-bg:#fff;--text-main:#333;--border-color:#e1e4e8}
*{box-sizing:border-box}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg-color);margin:0;display:flex;height:100vh;color:var(--text-main)}
.app-header{position:absolute;top:0;width:100%;height:50px;background:var(--lowes-blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:bold;font-size:1.2rem;z-index:100}
.app-header small{font-weight:normal;font-size:.75rem;opacity:.85;margin-right:10px}
.app-header button{background:#fff;color:var(--lowes-blue);border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:.8rem}
.container{display:flex;width:100%;margin-top:50px;height:calc(100vh - 50px)}
.column{background:var(--panel-bg);margin:15px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border-color)}
.col-left,.col-right{flex:1}
.col-center{flex:2;background:transparent;box-shadow:none;border:none;align-items:center;justify-content:flex-end;overflow:visible}
.panel-header{background:#f8f9fa;padding:15px;border-bottom:1px solid var(--border-color);font-weight:bold;color:var(--lowes-blue)}
.panel-content{padding:15px;overflow-y:auto;flex:1}
.cust-info p{margin:5px 0;font-size:.9rem}
.cust-info span,.panel-content>p span{font-weight:bold;color:#555}
.cart-item{border:1px solid #ddd;padding:10px;margin-bottom:10px;border-radius:5px;font-size:.85rem;background:#fafafa}
.cart-item a{color:var(--lowes-blue);text-decoration:none;font-weight:bold}
.chat-window{width:100%;max-width:550px;height:600px;max-height:100%;background:#fff;border-radius:10px 10px 0 0;box-shadow:0 5px 15px rgba(0,0,0,.2);display:flex;flex-direction:column;border:1px solid var(--border-color)}
.chat-header{background:var(--lowes-blue);color:#fff;padding:15px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.chat-header button{background:#d32f2f;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-weight:bold}
.chat-messages{flex:1;padding:15px;overflow-y:auto;background:#fcfcfc;display:flex;flex-direction:column;gap:10px}
.message{max-width:80%;padding:10px 15px;border-radius:18px;font-size:.9rem;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.msg-customer{background:#e9ecef;align-self:flex-start;border-bottom-left-radius:2px}
.msg-agent{background:var(--lowes-blue);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.msg-system{color:#888;align-self:center;font-size:.8rem;font-style:italic;text-align:center;max-width:95%}
.msg-error{color:#b71c1c;align-self:center;font-size:.8rem;text-align:center;max-width:95%;background:#fdecea;border-radius:8px}
.typing-indicator{display:none;font-size:.8rem;color:#666;margin:0 15px 10px;font-style:italic}
.chat-input-area{display:flex;padding:15px;border-top:1px solid var(--border-color);background:#fff}
.chat-input-area input{flex:1;padding:10px 14px;border:1px solid #ccc;border-radius:20px;outline:none;font-size:.95rem}
.chat-input-area button{background:var(--lowes-blue);color:#fff;border:none;padding:10px 20px;margin-left:10px;border-radius:20px;cursor:pointer;font-weight:bold}
.chat-input-area button:disabled,.chat-input-area input:disabled{opacity:.55;cursor:not-allowed}
.turn-head{font-size:.75rem;color:#666;margin:12px 0 6px;padding-top:8px;border-top:1px dashed #ccc}
.turn-head:first-child{border-top:none;margin-top:0;padding-top:0}
.whisper-card{padding:10px;margin-bottom:8px;font-size:.85rem;border-radius:4px;border-left:4px solid #aaa;background:#f0f0f0}
.whisper-card.pass{background:#d4edda;border-left-color:#28a745;color:#155724}
.whisper-card.missed{background:#f8d7da;border-left-color:#dc3545;color:#721c24}
.whisper-card.tip{background:#fff3cd;border-left-color:#ffc107;color:#856404}
.pillar{font-weight:bold;margin-bottom:4px;display:block;font-size:.9rem}
</style>
</head>
<body>
<div class="app-header">
  <span>Lowe's Customer Care Workspace</span>
  <span><small id="model-status">Model: detecting…</small><button onclick="changeKey()">API key</button></span>
</div>

<div class="container">
  <div class="column col-left">
    <div class="panel-header">Customer Profile &amp; Cart</div>
    <div class="panel-content" id="customer-info-container"></div>
  </div>

  <div class="column col-center">
    <div class="chat-window">
      <div class="chat-header">
        <span id="chat-title">Loading...</span>
        <button onclick="nextScenario()">End &amp; Next Chat</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="typing-indicator" id="typing-indicator">Customer is typing...</div>
      <div class="chat-input-area">
        <input type="text" id="agent-input" placeholder="Type your response here..." onkeydown="if(event.key==='Enter')sendAgentMessage()" disabled>
        <button id="send-btn" onclick="sendAgentMessage()" disabled>Send</button>
      </div>
    </div>
  </div>

  <div class="column col-right">
    <div class="panel-header">Real-time QA Whispers</div>
    <div class="panel-content" id="whispers-container"></div>
  </div>
</div>

<script>
// ---------- CONFIGURACIÓN ----------
// Clave integrada directamente (si la dejas vacía, la página la pedirá una vez y la guardará en este navegador).
const API_KEY = "AQ.Ab8RN6L0zQ1jTB2v1FDTi6x0bE4LsiqNboD2vegNx92NJMavLA";
const API = "https://generativelanguage.googleapis.com/v1beta";
const FALLBACK_MODELS = ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-2.5-flash", "gemini-2.0-flash"];
const IDLE_MS = 120000; // 2 minutos sin respuesta del agente

const products = {
  fridge: { title: "Frigidaire 25.6-cu ft Side-by-Side Refrigerator FRSS26L3AF", url: "https://www.lowes.com/pd/Frigidaire-25-6-cu-ft-Side-by-Side-Refrigerator-with-Ice-Maker-Fingerprint-Resistant-Stainless-Steel-ENERGY-STAR/5001964897" },
  dishwasher: { title: "Frigidaire 24-in Top Control Built-In Dishwasher FDPH431LAF", url: "https://www.lowes.com/pd/Frigidaire-24-in-Top-Control-Built-In-Dishwasher-Fingerprint-Resistant-Stainless-Steel-ENERGY-STAR-52-dBA/5013184647" },
  battery: { title: "DEWALT 20-V 2-Pack Lithium-ion Battery DCB205-2C", url: "https://www.lowes.com/pd/DEWALT-20-V-2-Pack-Lithium-ion-Battery/1000218533" },
  drone: { title: "Contixo Drones 12-mp Drone F28", url: "https://www.lowes.com/pd/Contixo-Drones-12-mp-Drone/5013824555" }
};

const scenarios = [
  {
    name: "Sarah Jenkins", type: "Indecisive, hesitant, asks lots of questions",
    address: "4102 Oak Lawn Ave", zip: "75219", state: "Texas", cart: [products.fridge],
    opening: "Ask for the exact width of the fridge including the hinges, because your space is tight. Sound a bit hesitant.",
    persona: "You are replacing an old fridge in a tight kitchen alcove that is about 36 inches wide (you are not sure of depth). You worry about making the wrong choice, ask follow-up questions (ice maker, delivery, haul-away of the old unit, return policy), and second-guess yourself. You decide only when the agent guides you with clear, confident recommendations."
  },
  {
    name: "Mike Peterson", type: "Angry, direct, impatient",
    address: "8801 N Central Expy", zip: "75231", state: "Texas", cart: [products.dishwasher],
    opening: "Complain that the website is not applying your military discount and demand immediate help.",
    persona: "You are a veteran and already tried to apply your military discount twice; this is the third time you are dealing with it. You are short, blunt and impatient, hate scripted replies and being put on hold without updates. You threaten to cancel the order and buy elsewhere if you feel ignored. If the agent apologizes sincerely, takes ownership and gives clear steps with a time frame, you calm down gradually."
  },
  {
    name: "Emily Davis", type: "Calm, polite, looking for deals",
    address: "1250 E Copans Rd", zip: "33064", state: "Florida", cart: [products.battery, products.drone],
    opening: "Politely ask how to split the order so the DEWALT batteries are store pickup and the drone is shipped, and ask where to enter your gift card.",
    persona: "You are friendly and value-minded: you like saving money, ask about price matching, free shipping and where to apply the gift card. You are open to add-ons or a protection plan only when the agent presents them confidently and explains the real value; you dislike pushy or vague offers."
  }
];

// ---------- ESTADO ----------
let apiKey = API_KEY, modelQueue = [], chatLog = [], idleTimer = null;
let authQuery = false; // false = header x-goog-api-key, true = ?key=
let busy = false, session = 0, agentTurns = 0, idx = 0, current = null;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Envía la petición con el header x-goog-api-key o con ?key= según authQuery
function geminiFetch(path, opts = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const url = API + path + (authQuery ? sep + "key=" + encodeURIComponent(apiKey) : "");
  const headers = Object.assign({}, opts.headers || {});
  if (!authQuery) headers["x-goog-api-key"] = apiKey;
  return fetch(url, Object.assign({}, opts, { headers }));
}

// ---------- API KEY ----------
function loadKey() {
  if (!apiKey) { try { apiKey = localStorage.getItem("gemini_key") || ""; } catch (e) {} }
  if (!apiKey) {
    apiKey = (prompt("Pega tu API key de Google AI Studio (Gemini):") || "").trim();
    if (apiKey) { try { localStorage.setItem("gemini_key", apiKey); } catch (e) {} }
  }
  apiKey = apiKey.replace(/[^\x21-\x7E]|["'`]/g, ""); // quita espacios, comillas y caracteres invisibles
  return apiKey;
}
function changeKey() {
  apiKey = ""; modelQueue = [];
  try { localStorage.removeItem("gemini_key"); } catch (e) {}
  loadKey();
}
function checkKeyError(msg) {
  if (/API key not valid|API_KEY_INVALID|API key expired/i.test(msg || "")) {
    apiKey = ""; modelQueue = [];
    try { localStorage.removeItem("gemini_key"); } catch (e) {}
    const err = new Error("La API key no es válida. Pulsa «API key» (arriba a la derecha) y pega una nueva.");
    err.fatal = true;
    throw err;
  }
}

// ---------- MODELOS: se detectan solos con ListModels ----------
async function discoverModels() {
  if (modelQueue.length) return;
  if (!loadKey()) throw new Error("Falta la API key. Pulsa «API key» (arriba a la derecha).");
  let names = [];
  try {
    let res = await geminiFetch("/models?pageSize=200");
    let data = await res.json();
    if (res.status === 401 || res.status === 403) {   // probar el otro método de autenticación
      authQuery = !authQuery;
      res = await geminiFetch("/models?pageSize=200");
      data = await res.json();
    }
    if (data.error) checkKeyError(data.error.message);
    const skip = /lite|image|tts|audio|live|embed|vision|robotics|computer|thinking|exp|8b|tuning/i;
    names = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace("models/", ""))
      .filter(n => /^gemini-\d+(\.\d+)?-flash/.test(n) && !skip.test(n))
      .map(n => ({ n, v: parseFloat(n.match(/^gemini-(\d+(?:\.\d+)?)/)[1]), p: /preview/.test(n) ? 1 : 0 }))
      .sort((a, b) => (a.p - b.p) || (b.v - a.v))   // estables primero, y la versión más nueva primero
      .map(o => o.n);
  } catch (e) { if (e.fatal) throw e; }
  modelQueue = names.length ? [...names, "gemini-flash-latest"] : [...FALLBACK_MODELS];
}

// Llama a Gemini; si un modelo no existe o está saturado, prueba el siguiente automáticamente.
async function callGemini(body) {
  await discoverModels();
  let lastErr = "sin respuesta", swapped = false;
  while (modelQueue.length) {
    const model = modelQueue[0];
    for (let attempt = 0; attempt < 2; attempt++) {
      let res, data;
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 60000);
      try {
        res = await geminiFetch(`/models/${model}:generateContent`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body), signal: ctrl.signal
        });
        data = await res.json();
      } catch (e) {
        throw new Error(e.name === "AbortError" ? `El modelo ${model} tardó más de 60 s en responder.` : "No se pudo conectar con la API de Gemini: " + e.message);
      } finally { clearTimeout(timer); }

      if (res.ok) {
        const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
        if (text) { $("model-status").textContent = "Model: " + model; return text; }
        lastErr = data.promptFeedback?.blockReason ? "respuesta bloqueada (" + data.promptFeedback.blockReason + ")" : "respuesta vacía";
        break;
      }
      const msg = data.error?.message || res.statusText;
      checkKeyError(msg);
      if ((res.status === 401 || res.status === 403) && !swapped) {   // alternar header <-> ?key= una vez
        swapped = true; authQuery = !authQuery; attempt--; continue;
      }
      lastErr = `${res.status} ${model}: ${msg}`;
      console.warn(lastErr);
      if ([429, 500, 503].includes(res.status) && attempt === 0) { await sleep(2000); continue; }
      break;
    }
    modelQueue.shift(); // este modelo falló: probar el siguiente
  }
  throw new Error("No se pudo obtener respuesta de Gemini (" + lastErr + ").");
}

// ---------- PROMPTS ----------
function customerPrompt() {
  const c = current;
  return `You are role-playing a REAL customer chatting with a Lowe's customer care agent on lowes.com. The person typing as the agent is a trainee.

WHO YOU ARE
Name: ${c.name}. Address: ${c.address}, ${c.state} ${c.zip}.
Personality: ${c.type}.
Items in your cart: ${c.cart.map(i => i.title).join("; ")}.
Situation and behavior: ${c.persona}
Opening (only for your very first message): ${c.opening}

HOW TO ACT
- Stay in character 100%. Never mention AI, simulation, training, QA or a coach.
- Write like a real person in a chat window: usually 1-3 short sentences, natural wording, no markdown, no quotation marks, no name prefix.
- Only know what this customer would really know. Answer what the agent asks and reveal other details gradually; never solve the problem for the agent or dump all information at once.
- React to the quality of service. Generic, scripted, slow or unempathetic replies make you more frustrated or hesitant. Warm, specific replies that take ownership and give clear next steps make you relax and cooperate. Do not become satisfied until the agent truly resolves your need.
- Never invent Lowe's policies as facts. If the agent states one, react like a normal customer (accept it, doubt it, or ask a follow-up).
- If the agent sets up the order: ask about total or pickup/delivery timing if they haven't said it, be willing to pay with a text-to-pay link if offered (you may ask once if it is secure), never type card numbers in chat, and respond naturally to add-on offers (accept if valuable and confidently presented, hesitate if pushy or vague).
- When your need is fully solved, thank the agent and wrap up. Otherwise keep the conversation moving with a realistic next message.
- Reply in English with ONLY the customer's next message.`;
}

function coachPrompt() {
  const c = current;
  return `You are a senior Customer Satisfaction (CSAT) quality coach with 15+ years leading chat support teams, coaching a trainee agent at Lowe's Customer Care in real time. You are strict but encouraging: honest, specific, actionable, never generic.

Customer: ${c.name} (${c.type}). Cart: ${c.cart.map(i => i.title).join("; ")}.

Evaluate ONLY the agent's LAST message, judged in the context of the whole transcript and the stage of the conversation. Lowe's call flow: Greeting -> Acknowledgment -> Probing questions -> Resolution / willingness to assist -> Closing.

What good looks like:
1. Flow: greeting (brand + own name + invitation to share the need) only at the start; then acknowledge, probe (one clear question at a time; never ask what the customer already said or what is visible in the cart/profile), resolve with ownership, set expectations, and use holding statements ("Give me a moment while I check...") instead of silence.
2. Empathy in EVERY turn, specific to what this customer said, not a repeated canned apology. With angry customers: de-escalate and take ownership first, solve second.
3. Positive, confident language: say what you CAN do; avoid "can't/unfortunately/policy" with no alternative; no blame, no jargon, correct grammar, professional tone, concise messages (no walls of text).
4. Accuracy: never state or promise facts (dimensions, policies, dates) unless verified; reward "let me verify" behavior and flag guesses.
5. Sale closing - ONLY when the agent is actually setting up or finalizing an order: (a) offers the "Text to pay" option, (b) shares the security Terms & Conditions, (c) gives a summary breakdown of the items, (d) upsells Better Together / LPP with an ASSUMPTIVE and POSITIVE tone (e.g. "I'll add the protection plan so it's covered") rather than a hesitant "would you like...?". Before that stage do NOT mark these as missed; at most give a "tip" about what to prepare.

Output rules:
- "phase": the current stage of the conversation.
- "score": 0-100 for this message (90+ only if it is truly excellent).
- "whispers": 2-4 items. "pillar" is one of: Flow, Empathy, Probing, Resolution, Tone, Accuracy, Text-to-Pay, T&C, Summary, Assumptive Upsell. "status" is pass, missed or tip. "message" is ONE short coaching sentence (max 25 words) that refers to what the agent actually wrote.
- "better_reply": a brief example of a stronger agent message if score < 85, otherwise an empty string.
- Write all coaching in English.`;
}

const COACH_SCHEMA = {
  type: "OBJECT",
  properties: {
    phase: { type: "STRING" },
    score: { type: "INTEGER" },
    whispers: {
      type: "ARRAY",
      items: {
        type: "OBJECT",
        properties: { pillar: { type: "STRING" }, status: { type: "STRING", enum: ["pass", "missed", "tip"] }, message: { type: "STRING" } },
        required: ["pillar", "status", "message"]
      }
    },
    better_reply: { type: "STRING" }
  },
  required: ["phase", "score", "whispers", "better_reply"]
};

// ---------- LLAMADAS DE IA ----------
function customerContents() {
  const turns = [["user", "[SYSTEM NOTE] The chat just connected. Send your first message to the agent."]];
  chatLog.forEach(m => turns.push([
    m.who === "customer" ? "model" : "user",
    m.who === "system" ? "[SYSTEM NOTE] " + m.text : m.text
  ]));
  const out = [];
  turns.forEach(([role, text]) => {           // une turnos seguidos del mismo rol
    const last = out[out.length - 1];
    if (last && last.role === role) last.parts[0].text += "\n" + text;
    else out.push({ role, parts: [{ text }] });
  });
  return out;
}

async function askCustomer() {
  const text = await callGemini({
    systemInstruction: { parts: [{ text: customerPrompt() }] },
    contents: customerContents(),
    generationConfig: { temperature: 1 }
  });
  return text.replace(/^\s*(customer|cliente)\s*:\s*/i, "").replace(/^["“]+|["”]+$/g, "").trim();
}

async function askCoach() {
  const transcript = chatLog.map(m => (m.who === "agent" ? "AGENT" : m.who === "customer" ? "CUSTOMER" : "NOTE") + ": " + m.text).join("\n");
  const raw = await callGemini({
    systemInstruction: { parts: [{ text: coachPrompt() }] },
    contents: [{ role: "user", parts: [{ text: `TRANSCRIPT SO FAR (agent turn #${agentTurns}; the last AGENT line is the message to evaluate):\n${transcript}` }] }],
    generationConfig: { temperature: 0.3, responseMimeType: "application/json", responseSchema: COACH_SCHEMA }
  });
  return JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
}

// ---------- UI ----------
function addMsg(kind, text) {
  const box = $("chat-messages"), d = document.createElement("div");
  d.className = "message msg-" + kind;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function setBusy(b) {
  busy = b;
  $("agent-input").disabled = b;
  $("send-btn").disabled = b;
  $("typing-indicator").style.display = b ? "block" : "none";
  if (!b) $("agent-input").focus();
}

function showWhispers(r, n) {
  const g = document.createElement("div");
  const score = Math.max(0, Math.min(100, Number(r.score) || 0));
  let html = `<div class="turn-head">Message #${n} · ${esc(r.phase || "")} · <b>${score}/100</b></div>`;
  (r.whispers || []).forEach(w => {
    const st = ["pass", "missed", "tip"].includes(w.status) ? w.status : "tip";
    html += `<div class="whisper-card ${st}"><span class="pillar">${esc(w.pillar)}</span>${esc(w.message)}</div>`;
  });
  if (r.better_reply) html += `<div class="whisper-card tip"><span class="pillar">Try something like</span>“${esc(r.better_reply)}”</div>`;
  g.innerHTML = html;
  $("whispers-container").prepend(g);
}

function whisperCard(cls, title, text) {
  return `<div class="whisper-card ${cls}"><span class="pillar">${esc(title)}</span>${esc(text)}</div>`;
}

// ---------- FLUJO ----------
async function customerTurn(sid) {
  setBusy(true);
  try {
    const reply = await askCustomer();
    await sleep(Math.min(3500, 500 + reply.length * 20)); // simula el tiempo de escritura
    if (sid !== session) return;
    chatLog.push({ who: "customer", text: reply });
    addMsg("customer", reply);
    resetIdleTimer(sid);
  } catch (e) {
    if (sid === session) addMsg("error", "Error: " + e.message);
  } finally {
    if (sid === session) setBusy(false);
  }
}

async function sendAgentMessage() {
  const input = $("agent-input"), text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  clearTimeout(idleTimer);
  chatLog.push({ who: "agent", text });
  addMsg("agent", text);
  agentTurns++;
  const sid = session, n = agentTurns;
  askCoach().then(
    r => { if (sid === session) showWhispers(r, n); },
    e => { if (sid === session) $("whispers-container").insertAdjacentHTML("afterbegin", whisperCard("missed", "Coach unavailable", e.message)); }
  );
  await customerTurn(sid);
}

function resetIdleTimer(sid) {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (sid !== session || busy) return;
    chatLog.push({ who: "system", text: "The agent has not replied for 2 minutes. Send one short, in-persona message asking if they are still there." });
    addMsg("system", "2 minutes without a reply…");
    customerTurn(sid);
  }, IDLE_MS);
}

function loadScenario() {
  session++;
  clearTimeout(idleTimer);
  current = scenarios[idx % scenarios.length];
  chatLog = []; agentTurns = 0;
  $("chat-messages").innerHTML = "";
  $("whispers-container").innerHTML = whisperCard("tip", "System ready", "Flow: Greeting → Acknowledgment → Probing → Resolution. Empathy is required in every turn. Closing: Text to pay, T&C, item summary and an assumptive Better Together / LPP offer.");
  $("customer-info-container").innerHTML = `
    <div class="cust-info">
      <p><span>Name:</span> ${esc(current.name)}</p>
      <p><span>Address:</span> ${esc(current.address)}</p>
      <p><span>Zip Code:</span> ${esc(current.zip)} (${esc(current.state)})</p>
      <p><span>Persona:</span> ${esc(current.type)}</p>
    </div>
    <hr style="border:0;border-top:1px solid #ddd;margin:15px 0">
    <p><span>Active Cart:</span></p>
    ${current.cart.map(i => `<div class="cart-item"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>`).join("")}`;
  $("chat-title").textContent = "Chatting with " + current.name;
  customerTurn(session);
}

function nextScenario() { idx++; loadScenario(); }

window.onload = loadScenario;
</script>
</body>
</html>
